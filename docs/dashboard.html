<style>
:root {
  --bg:     #EEF5F6;
  --white:  #FFFFFF;
  --navy:   #003C50;
  --teal:   #288CA0;
  --lteal:  #A8D0D8;
  --gold:   #B87820;
  --hi:     #1A7A5E;
  --lo:     #7A9AA8;
  --text:   #002838;
  --dim:    #6A8C98;
  --border: #C8DDE2;
  --hdr:    60px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:1024px; height:600px; overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:'Jost', sans-serif;
}

/* Subtle water texture in bg */
body {
  background-image:
    linear-gradient(135deg, rgba(40,140,160,.04) 25%, transparent 25%),
    linear-gradient(225deg, rgba(40,140,160,.04) 25%, transparent 25%),
    linear-gradient(315deg, rgba(40,140,160,.04) 25%, transparent 25%),
    linear-gradient(45deg,  rgba(40,140,160,.04) 25%, transparent 25%);
  background-size:20px 20px;
  background-position:0 0, 10px 0, 10px -10px, 0px 10px;
}

/* ══ HEADER ══════════════════════════════════════════ */
.hdr {
  height:var(--hdr);
  background:var(--navy);
  display:flex; align-items:center;
  padding:0 22px; gap:14px;
  position:relative;
}
.hdr::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,
    transparent 0%,
    var(--teal) 25%,
    var(--lteal) 50%,
    var(--teal) 75%,
    transparent 100%
  );
}
.hdr-logo {
  height:40px; width:40px; object-fit:contain;
  border-radius:3px; flex-shrink:0;
  background:#fff; padding:2px;
}
.hdr-sep {
  width:1px; height:28px;
  background:linear-gradient(180deg, transparent, rgba(255,255,255,.28), transparent);
  flex-shrink:0;
}
.hdr-name {
  font-family:'Libre Baskerville', serif;
  font-size:1.08rem; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase;
  color:#fff; flex-shrink:0;
}
.hdr-right {
  margin-left:auto; text-align:right; flex-shrink:0;
  font-family:'JetBrains Mono', monospace;
  font-size:.52rem; font-weight:300;
  letter-spacing:.1em; text-transform:uppercase;
  color:rgba(255,255,255,.42); line-height:1.9;
}
.hdr-clock {
  font-size:.88rem; font-weight:400;
  color:rgba(255,255,255,.82);
  letter-spacing:.06em;
}

/* ══ CONTENT ═════════════════════════════════════════ */
.content {
  height:calc(600px - var(--hdr));
  display:flex; flex-direction:column;
  gap:8px; padding:9px;
}

/* ══ GAUGE ROW ═══════════════════════════════════════ */
.gauges {
  display:flex; gap:6px; flex-shrink:0;
}
.g-wrap {
  flex:1; display:flex; flex-direction:column;
  align-items:center; gap:3px;
}
.g-label {
  font-family:'JetBrains Mono', monospace;
  font-size:.43rem; font-weight:400;
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--dim); text-align:center;
}

/* ══ CHART CARD ══════════════════════════════════════ */
.chart-card {
  flex:1;
  background:var(--white);
  border:1px solid var(--border);
  border-top:2px solid var(--teal);
  padding:9px 14px 6px;
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
.chart-card::before {
  content:'';
  position:absolute; top:6px; right:8px;
  width:7px; height:7px;
  border-top:1px solid var(--lteal);
  border-right:1px solid var(--lteal);
  opacity:.6;
}
.chart-title {
  font-family:'JetBrains Mono', monospace;
  font-size:.46rem; font-weight:400;
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--dim); margin-bottom:7px; flex-shrink:0;
}
.chart-el {
  flex:1; position:relative; min-height:0;
}

/* ══ ANIMATIONS ══════════════════════════════════════ */
@keyframes rise {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
.g-wrap { animation:rise .5s ease both; }
.g-wrap:nth-child(1) { animation-delay:.04s; }
.g-wrap:nth-child(2) { animation-delay:.09s; }
.g-wrap:nth-child(3) { animation-delay:.14s; }
.g-wrap:nth-child(4) { animation-delay:.19s; }
.g-wrap:nth-child(5) { animation-delay:.24s; }
.g-wrap:nth-child(6) { animation-delay:.29s; }
.chart-card { animation:rise .5s .34s ease both; }
</style>
</head>

        <!-- needle dot at (108.9, 35.0) -->
        <circle cx="108.9" cy="35.0" r="4.5" fill="#003C50" stroke="#fff" stroke-width="2"/>
        <text x="14" y="137" text-anchor="middle" font-size="9" fill="#A0B8C0" font-family="JetBrains Mono,monospace">980</text>
        <text x="134" y="137" text-anchor="middle" font-size="9" fill="#A0B8C0" font-family="JetBrains Mono,monospace">1040</text>
        <text x="74" y="76" text-anchor="middle" font-size="24" font-weight="300" fill="#002838" font-family="JetBrains Mono,monospace">1018</text>
        <text x="74" y="91" text-anchor="middle" font-size="11" fill="#6A8C98" font-family="JetBrains Mono,monospace">.4 mb</text>
        <text x="74" y="110" text-anchor="middle" font-size="9" fill="#A0B8C0" font-family="JetBrains Mono,monospace">rising</text>
      </svg>
      <div class="g-label">Pressure</div>
    </div>

    <!-- MOON PHASE -->
    <div class="g-wrap">
      <svg viewBox="0 0 148 152" style="width:100%;max-width:162px;display:block" id="moon-svg">
        <circle cx="74" cy="80" r="57" fill="rgba(184,120,32,.04)"/>
        <circle cx="74" cy="80" r="57" fill="none"
          stroke="#D0E4E8" stroke-width="7"
          stroke-dasharray="268.6 89.5"
          stroke-linecap="round"
          transform="rotate(135, 74, 80)"/>
        <!-- fill: full moon f=1.0, filled=268.6 -->
        <circle id="moon-arc" cx="74" cy="80" r="57" fill="none"
          stroke="#B87820" stroke-width="7"
          stroke-dasharray="268.6 89.5"
          stroke-linecap="round"
          transform="rotate(135, 74, 80)"/>
        <circle id="moon-dot" cx="114.3" cy="120.3" r="4.5" fill="#B87820" stroke="#fff" stroke-width="2"/>
        <text id="moon-em" x="74" y="85" text-anchor="middle" font-size="34">🌕</text>
        <text id="moon-name" x="74" y="105" text-anchor="middle" font-size="9.5" fill="#B87820" font-family="Libre Baskerville,serif" font-style="italic">Full Moon</text>
      </svg>
      <div class="g-label">Lunar Phase</div>
    </div>

  </div><!-- /gauges -->

  <!-- ── FULL-WIDTH CHART ── -->
  <div class="chart-card">
    <div class="chart-title">48-Hour Tide Prediction &nbsp;·&nbsp; Bush Point, WA &nbsp;·&nbsp; NOAA Station 9444900</div>
    <div class="chart-el" id="tc">
      <span style="font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--dim)">Loading chart&hellip;</span>
    </div>
  </div>

</div><!-- /content -->

<script>
const MF = 8.35, CF = 8.42;

// Clock
(function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.getHours().toString().padStart(2,'0') + ':' +
    n.getMinutes().toString().padStart(2,'0');
  setTimeout(tick, 15000);
})();

// Moon phase — updates arc fill and emoji
(function() {
  const syn = 29.53059 * 86400000;
  const pct = ((Date.now() - new Date('2000-01-06T18:14:00Z')) % syn + syn) % syn / syn;
  const P = [
    [.03,'🌑','New Moon',     0   ],
    [.25,'🌒','Waxing Crescent',.25],
    [.27,'🌓','First Quarter',.5  ],
    [.49,'🌔','Waxing Gibbous',.75],
    [.51,'🌕','Full Moon',    1.0 ],
    [.73,'🌖','Waning Gibbous',.75],
    [.77,'🌗','Last Quarter', .5  ],
    [.97,'🌘','Waning Crescent',.25],
    [1., '🌑','New Moon',     0   ]
  ];
  const p = P.find(x => pct <= x[0]);
  document.getElementById('moon-em').textContent   = p[1];
  document.getElementById('moon-name').textContent = p[2];
  // Update arc fill
  const circ = 358.1, arc270 = 268.6;
  const f = p[3];
  const filled = f * arc270;
  document.getElementById('moon-arc').setAttribute('stroke-dasharray', filled + ' ' + (circ - filled));
  // Update needle dot position
  const angle = (135 + f * 270) * Math.PI / 180;
  const cx = 74 + 57 * Math.cos(angle);
  const cy = 80 + 57 * Math.sin(angle);
  const dot = document.getElementById('moon-dot');
  dot.setAttribute('cx', cx.toFixed(1));
  dot.setAttribute('cy', cy.toFixed(1));
  if (f === 0) dot.style.display = 'none';
})();

// Tide chart — full width
(async () => {
  const el = document.getElementById('tc');
  try {
    // Fetch 12h of past + 36h of future so "now" appears ~1/4 from left
    function noaaDateStr(ms) {
      const d = new Date(ms);
      return d.getUTCFullYear().toString() +
        (d.getUTCMonth()+1).toString().padStart(2,'0') +
        d.getUTCDate().toString().padStart(2,'0') + ' ' +
        d.getUTCHours().toString().padStart(2,'0') + ':00';
    }
    const nowMs = Date.now();
    const r = await fetch(
      'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter' +
      '?station=9444900&product=predictions&datum=MLLW' +
      '&time_zone=gmt&interval=h&units=english&format=json' +
      '&begin_date=' + encodeURIComponent(noaaDateStr(nowMs - 12*3600000)) +
      '&end_date='   + encodeURIComponent(noaaDateStr(nowMs + 36*3600000))
    );
    if (!r.ok) throw 0;
    const { predictions: P } = await r.json();
    const vs = P.map(p => +p.v);
    const lo = Math.min(...vs) - .35, hi = Math.max(...vs) + .35;
    const W  = el.offsetWidth  || 980;
    const H  = el.offsetHeight || 310;
    const PL=38, PB=26, PT=10, PR=12;
    const cw=W-PL-PR, ch=H-PT-PB;
    const ts = P.map(p => new Date(p.t.replace(' ','T')+'Z').getTime());
    const t0=ts[0], t1=ts[ts.length-1];
    const tx = t => (PL + cw*(t-t0)/(t1-t0)).toFixed(1);
    const ty = v => (PT + ch*(1-(v-lo)/(hi-lo))).toFixed(1);
    const now = Date.now();

    let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block">
<defs>
  <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#288CA0" stop-opacity=".18"/>
    <stop offset="60%"  stop-color="#288CA0" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#288CA0" stop-opacity=".01"/>
  </linearGradient>
  <clipPath id="cc"><rect x="${PL}" y="${PT}" width="${cw}" height="${ch}"/></clipPath>
</defs>`;

    // Horizontal grid lines
    for (let v = Math.ceil(lo); v <= hi; v++) {
      const y = +ty(v), maj = v % 2 === 0;
      s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}"
stroke="${maj ? '#D8ECF0' : '#EBF4F6'}" stroke-width="${maj ? 1 : .5}" clip-path="url(#cc)"/>`;
      if (maj) s += `<text x="${PL-5}" y="${y+3.5}" text-anchor="end"
font-size="9.5" font-family="JetBrains Mono,monospace" font-weight="300" fill="#9ABAC4">${v}</text>`;
    }

    // MSL dashed line
    const mY = +ty(MF);
    s += `<line x1="${PL}" y1="${mY}" x2="${W-PR}" y2="${mY}"
stroke="#288CA0" stroke-width="1.2" stroke-dasharray="6,4" opacity=".35" clip-path="url(#cc)"/>`;
    s += `<text x="${PL+8}" y="${mY-5}" font-size="8.5"
font-family="JetBrains Mono,monospace" fill="#288CA0" opacity=".6">MSL</text>`;

    // Area fill
    const path = P.map((p,i) => (i?'L':'M') + tx(ts[i]) + ',' + ty(vs[i])).join('');
    s += `<path d="${path} L${tx(t1)},${H-PB} L${PL},${H-PB}Z"
fill="url(#wg)" clip-path="url(#cc)"/>`;
    // Curve
    s += `<path d="${path}" fill="none" stroke="#288CA0" stroke-width="2.5"
stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cc)"/>`;

    // Hi/Lo diamond markers
    for (let i = 1; i < P.length - 1; i++) {
      const isH = vs[i] > vs[i-1] && vs[i] > vs[i+1];
      const isL = vs[i] < vs[i-1] && vs[i] < vs[i+1];
      if (!isH && !isL) continue;
      const cx = +tx(ts[i]), cy = +ty(vs[i]);
      const col = isH ? '#1A7A5E' : '#7A9AA8';
      const yo  = isH ? -9 : 13;
      s += `<polygon points="${cx},${cy-5} ${cx+4},${cy} ${cx},${cy+5} ${cx-4},${cy}"
fill="${col}" opacity=".82" clip-path="url(#cc)"/>`;
      s += `<text x="${cx}" y="${cy+yo}" text-anchor="middle"
font-size="9.5" font-family="JetBrains Mono,monospace" font-weight="400" fill="${col}">${vs[i].toFixed(1)}</text>`;
    }

    // Now line + current level dot
    const nx = +tx(now);
    if (nx > PL && nx < W-PR) {
      s += `<line x1="${nx}" y1="${PT}" x2="${nx}" y2="${H-PB}"
stroke="#B87820" stroke-width="1.2" stroke-dasharray="4,3" opacity=".65" clip-path="url(#cc)"/>`;
      if (CF > 0) {
        const cy = +ty(CF);
        s += `<circle cx="${nx}" cy="${cy}" r="5.5"
fill="#B87820" stroke="#fff" stroke-width="2" opacity=".92"/>`;
      }
    }

    // Time axis
    for (let t = t0; t <= t1; t += 6*3600000) {
      const x = +tx(t);
      if (x > PL+20 && x < W-PR-20) {
        const d = new Date(t);
        const pt = new Date(d.toLocaleString('en-US', {timeZone:'America/Los_Angeles'}));
        const h = pt.getHours();
        const lbl = h===0
          ? `${pt.getMonth()+1}/${pt.getDate()}`
          : h.toString().padStart(2,'0')+':00';
        s += `<text x="${x}" y="${H-7}" text-anchor="middle"
font-size="9" font-family="JetBrains Mono,monospace" font-weight="300" fill="#9ABAC4">${lbl}</text>`;
        s += `<line x1="${x}" y1="${H-PB}" x2="${x}" y2="${H-PB+4}" stroke="#C8DDE2"/>`;
      }
    }

    // Axes
    s += `<line x1="${PL}" y1="${PT}"   x2="${PL}"   y2="${H-PB}" stroke="#C8DDE2"/>`;
    s += `<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#C8DDE2"/>`;
    s += '</svg>';
    el.innerHTML = s;
  } catch(e) {
    el.innerHTML = '<span style="font-family:JetBrains Mono,monospace;font-size:.75rem;color:#9ABAC4">Chart unavailable</span>';
  }
})();
</script>
</body>
</html>
