<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1">
<title>Spyglass Beach House — Tide Gauge</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:       #1a3a4f;
  --teal:       #2a7d8c;
  --teal-light: #3a9aac;
  --cream:      #f4efe6;
  --cream-dk:   #ebe4d8;
  --text:       #1a2c38;
  --dim:        #5a7080;
  --border:     #ccc4b4;
  --pos:        #2a7d8c;
  --neg:        #7a909e;
  --danger:     #c0392b;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:1024px; height:600px; overflow:hidden;
  background: var(--cream);
  color: var(--text);
  font-family: 'Cormorant Garamond', Georgia, serif;
  background-image:
    linear-gradient(rgba(42,125,140,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(42,125,140,.05) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* ── HEADER ──────────────────────────────────────── */
.hdr {
  height:60px; display:flex; align-items:center;
  padding:0 18px; gap:14px;
  background:var(--navy);
  border-bottom:3px solid var(--teal);
}
.hdr-logo { height:40px; width:40px; object-fit:contain;
  filter:brightness(0) invert(1); opacity:.9; }
.hdr-sep { width:1px; height:30px; background:rgba(255,255,255,.18); }
.hdr-name {
  font-size:1.15rem; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; color:#fff;
}
.hdr-right {
  margin-left:auto; text-align:right;
  font-family:'DM Mono',monospace; font-size:.6rem;
  letter-spacing:.1em; text-transform:uppercase;
  color:rgba(255,255,255,.45); line-height:1.7;
}

/* ── GRID ────────────────────────────────────────── */
.grid {
  height:540px;
  display:grid;
  grid-template-columns:208px 1fr 264px;
  gap:10px; padding:10px;
}

/* ── CARD ────────────────────────────────────────── */
.card {
  background:rgba(255,255,255,.72);
  border:1px solid var(--border);
  border-top:2.5px solid var(--teal);
  border-radius:3px;
  padding:13px 15px;
  backdrop-filter:blur(2px);
}
.lbl {
  font-family:'DM Mono',monospace; font-size:.58rem;
  letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim); margin-bottom:9px;
}

/* ── LEFT COLUMN ─────────────────────────────────── */
.left { display:flex; flex-direction:column; gap:9px; }

.tide-num {
  font-family:'DM Mono',monospace; font-size:3.4rem;
  font-weight:500; color:var(--navy); line-height:1;
  letter-spacing:-.02em;
}
.tide-unit { font-size:.85rem; color:var(--dim); margin-left:3px; vertical-align:.45em; }
.tide-delta { font-family:'DM Mono',monospace; font-size:.78rem; margin-top:5px; }
.tide-delta.pos { color:var(--pos); }
.tide-delta.neg { color:var(--neg); }

.bar-wrap {
  margin:10px 0 4px; height:7px; border-radius:4px;
  background:var(--cream-dk); border:1px solid var(--border);
  position:relative; overflow:hidden;
}
.bar-fill { height:100%; border-radius:4px; transition:width .8s ease; }
.bar-center {
  position:absolute; left:50%; top:0; bottom:0;
  width:1px; background:var(--dim); opacity:.35;
}
.bar-labs {
  display:flex; justify-content:space-between;
  font-family:'DM Mono',monospace; font-size:.53rem;
  color:var(--dim);
}

.next-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.n-label { font-family:'DM Mono',monospace; font-size:.57rem;
  letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
.n-val { font-family:'DM Mono',monospace; font-size:1rem;
  font-weight:500; color:var(--navy); margin-top:2px; }
.n-wide { grid-column:1/-1; }

.stamp { font-family:'DM Mono',monospace; font-size:.7rem;
  color:var(--navy); }

/* ── CENTER COLUMN ───────────────────────────────── */
.center { display:flex; flex-direction:column; }
.chart-card { flex:1; }
.chart-inner { height:calc(100% - 22px); }

/* ── RIGHT COLUMN ────────────────────────────────── */
.right { display:flex; flex-direction:column; gap:9px; }
.conds { flex:1; display:flex; flex-direction:column; }
.cond-row {
  display:flex; align-items:center;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid var(--cream-dk);
  flex:1;
}
.cond-row:last-child { border-bottom:none; }
.cond-lbl { font-family:'DM Mono',monospace; font-size:.57rem;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.cond-val { font-family:'DM Mono',monospace; font-size:.95rem;
  font-weight:500; color:var(--navy); text-align:right; }
.cond-val.xl { font-size:1.55rem; }

.moon-card { text-align:center; padding:10px 14px; }
.moon-em { font-size:1.9rem; line-height:1; display:block; }
.moon-nm { font-family:'DM Mono',monospace; font-size:.6rem;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--dim); margin-top:4px; }
</style>
</head>

  <div class="hdr-sep"></div>
  <div class="hdr-name">Spyglass Beach House</div>
  <div class="hdr-right">
    Port Townsend, WA &nbsp;·&nbsp; NOAA Station 9444900<br>
    <span id="clock">--:--</span>
  </div>
</header>

<div class="grid">

  <!-- LEFT -->
  <div class="left">
    <div class="card">
      <div class="lbl">Current Tide</div>
      <div>
        <span class="tide-num" id="tide-ft">--.-</span><span class="tide-unit">ft</span>
      </div>
      <div class="tide-delta" id="tide-delta">&nbsp;</div>
      <div class="bar-wrap">
        <div class="bar-fill" id="bar" style="width:50%;background:var(--teal)"></div>
        <div class="bar-center"></div>
      </div>
      <div class="bar-labs"><span>−8 ft</span><span>MSL</span><span>+8 ft</span></div>
    </div>

    <div class="card">
      <div class="lbl">Next Event</div>
      <div class="next-grid">
        <div>
          <div class="n-label" id="ne-type-lbl">Next</div>
          <div class="n-val" id="ne-type">--</div>
        </div>
        <div>
          <div class="n-label">Height</div>
          <div class="n-val" id="ne-ft">-- ft</div>
        </div>
        <div class="n-wide">
          <div class="n-label">At</div>
          <div class="n-val" id="ne-time">--</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:10px 15px; margin-top:auto">
      <div class="lbl" style="margin-bottom:3px">Updated</div>
      <div class="stamp" id="updated">--:--</div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="card chart-card">
      <div class="lbl">48-Hour Tide Prediction</div>
      <div class="chart-inner" id="tc">
        <span style="font-family:'DM Mono',monospace;font-size:.75rem;color:var(--dim)">Loading chart&hellip;</span>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="card conds">
      <div class="lbl" style="margin-bottom:4px">Conditions &mdash; Stn 9444900</div>
      <div class="cond-row">
        <span class="cond-lbl">Temperature</span>
        <span class="cond-val xl" id="c-temp">--°F</span>
      </div>
      <div class="cond-row">
        <span class="cond-lbl">Wind</span>
        <span class="cond-val" id="c-wind">-- kt</span>
      </div>
      <div class="cond-row">
        <span class="cond-lbl">Gust</span>
        <span class="cond-val" id="c-gust">-- kt</span>
      </div>
      <div class="cond-row">
        <span class="cond-lbl">Pressure</span>
        <span class="cond-val" id="c-pres">-- mb</span>
      </div>
    </div>

    <div class="card moon-card">
      <div class="lbl" style="text-align:center;margin-bottom:5px">Moon Phase</div>
      <span class="moon-em" id="moon-em">🌕</span>
      <div class="moon-nm" id="moon-nm">Loading&hellip;</div>
    </div>
  </div>

</div>

<script>
const CF = 0, MF = 8.35;

// ── Clock ─────────────────────────────────────────
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.getHours().toString().padStart(2,'0') + ':' +
    n.getMinutes().toString().padStart(2,'0');
}
tick(); setInterval(tick, 15000);

// ── Moon phase ────────────────────────────────────
(function() {
  const epoch = new Date('2000-01-06T18:14:00Z').getTime();
  const syn   = 29.53059 * 86400000;
  const age   = ((Date.now() - epoch) % syn + syn) % syn;
  const pct   = age / syn;
  const phases = [
    [.03,'🌑','New Moon'],      [.25,'🌒','Waxing Crescent'],
    [.27,'🌓','First Quarter'], [.49,'🌔','Waxing Gibbous'],
    [.51,'🌕','Full Moon'],     [.73,'🌖','Waning Gibbous'],
    [.77,'🌗','Last Quarter'],  [.97,'🌘','Waning Crescent'],
    [1.0,'🌑','New Moon']
  ];
  const p = phases.find(p => pct <= p[0]);
  document.getElementById('moon-em').textContent = p[1];
  document.getElementById('moon-nm').textContent = p[2];
})();

// ── Tide chart ────────────────────────────────────
(async () => {
  const el = document.getElementById('tc');
  try {
    const r = await fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?station=9444900&product=predictions&datum=MLLW&time_zone=gmt&interval=h&units=english&format=json&range=48');
    if (!r.ok) throw 0;
    const { predictions: P } = await r.json();
    const vs = P.map(p => +p.v);
    const lo = Math.min(...vs) - .3, hi = Math.max(...vs) + .3;
    const W = el.offsetWidth || 470, H = el.offsetHeight - 2 || 440;
    const PL = 32, PB = 24, PT = 8, PR = 8;
    const cw = W-PL-PR, ch = H-PT-PB;
    const ts = P.map(p => new Date(p.t.replace(' ','T')+'Z').getTime());
    const t0 = ts[0], t1 = ts[ts.length-1];
    const tx = t => (PL + cw*(t-t0)/(t1-t0)).toFixed(1);
    const ty = v => (PT + ch*(1-(v-lo)/(hi-lo))).toFixed(1);
    const now = Date.now();
    let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block">`;
    s += `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a7d8c" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#2a7d8c" stop-opacity=".02"/>
    </linearGradient></defs>`;
    // Grid lines
    for (let v = Math.ceil(lo/2)*2; v <= hi; v += 2) {
      const y = +ty(v);
      s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#ccc4b4" stroke-width=".5"/>`;
      s += `<text x="${PL-4}" y="${y+3}" text-anchor="end" font-size="9" font-family="DM Mono,monospace" fill="#8a9aaa">${v}</text>`;
    }
    // MSL
    const mY = +ty(MF);
    s += `<line x1="${PL}" y1="${mY}" x2="${W-PR}" y2="${mY}" stroke="#2a7d8c" stroke-width="1" stroke-dasharray="5,4" opacity=".5"/>`;
    s += `<text x="${PL+4}" y="${mY-4}" font-size="8" font-family="DM Mono,monospace" fill="#2a7d8c" opacity=".8">MSL</text>`;
    // Fill + curve
    const path = P.map((p,i) => (i?'L':'M')+tx(ts[i])+','+ty(vs[i])).join('');
    s += `<path d="${path} L${tx(t1)},${H-PB} L${PL},${H-PB}Z" fill="url(#g)"/>`;
    s += `<path d="${path}" fill="none" stroke="#2a7d8c" stroke-width="2.5" stroke-linejoin="round"/>`;
    // Hi/Lo dots + labels
    for (let i = 1; i < P.length-1; i++) {
      const isHi = vs[i]>vs[i-1] && vs[i]>vs[i+1];
      const isLo = vs[i]<vs[i-1] && vs[i]<vs[i+1];
      if (isHi || isLo) {
        const x = tx(ts[i]), y = +ty(vs[i]);
        const col = isHi ? '#2a7d8c' : '#7a909e';
        s += `<circle cx="${x}" cy="${y}" r="3.5" fill="${col}" opacity=".8"/>`;
        s += `<text x="${x}" y="${isHi ? y-7 : y+13}" text-anchor="middle" font-size="9" font-family="DM Mono,monospace" fill="${col}" font-weight="500">${vs[i].toFixed(1)}</text>`;
      }
    }
    // Now line
    const nx = +tx(now);
    if (nx > PL && nx < W-PR) {
      s += `<line x1="${nx}" y1="${PT}" x2="${nx}" y2="${H-PB}" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3" opacity=".65"/>`;
      if (CF > 0) s += `<circle cx="${nx}" cy="${ty(CF)}" r="4.5" fill="#c0392b" stroke="white" stroke-width="1.5" opacity=".85"/>`;
    }
    // Time axis
    for (let t = t0; t <= t1; t += 6*3600000) {
      const x = +tx(t);
      if (x > PL+10 && x < W-PR-10) {
        const d = new Date(t);
        const h = d.getHours();
        const lbl = h===0 ? `${d.getMonth()+1}/${d.getDate()}` : h.toString().padStart(2,'0')+':00';
        s += `<text x="${x}" y="${H-5}" text-anchor="middle" font-size="9" font-family="DM Mono,monospace" fill="#8a9aaa">${lbl}</text>`;
        s += `<line x1="${x}" y1="${H-PB}" x2="${x}" y2="${H-PB+3}" stroke="#ccc4b4" stroke-width="1"/>`;
      }
    }
    // Axes
    s += `<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="#ccc4b4" stroke-width="1"/>`;
    s += `<line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="#ccc4b4" stroke-width="1"/>`;
    s += '</svg>';
    el.innerHTML = s;
  } catch(e) {
    el.innerHTML = '<span style="font-family:DM Mono,monospace;font-size:.75rem;color:#8a9aaa">Chart unavailable</span>';
  }
})();
</script>
